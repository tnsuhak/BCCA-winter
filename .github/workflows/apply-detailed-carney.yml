name: Apply detailed Carney content
on:
  push:
    branches: [feat/carney-winter-schooling]
    paths:
      - tools/apply_detailed_carney.py
      - .github/workflows/apply-detailed-carney.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carney-winter-schooling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate detailed page
        run: python tools/apply_detailed_carney.py
      - name: Validate public content
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for t in ['5주 일정은','홈스테이는 출국 전에','실제 상담에서 많이 묻는','카카오 캐나다 유학정보방']:
              assert t in s, t
          for t in ['에이전트 커미션','한국 계좌','캐나다 계좌','강수정 차장','778-928-9303']:
              assert t not in s, t
          print('validation passed')
          PY
      - name: Commit generated page
        run: |
          if git diff --quiet -- index.html; then echo 'No index changes'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expand Carney winter schooling details and schedule"
          git push origin HEAD:feat/carney-winter-schooling
