name: Inspect existing OG image
on:
  push:
    branches: [feat/carney-kakao-og]
    paths:
      - '.github/workflows/inspect-old-og.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carney-kakao-og
      - name: Inspect old OG image
        shell: bash
        run: |
          file og.jpg || true
          identify og.jpg 2>/dev/null || true
          if command -v tesseract >/dev/null 2>&1; then
            echo '--- OCR ---'
            tesseract og.jpg stdout --psm 6 -l eng 2>/dev/null || true
          else
            echo 'tesseract-not-installed'
          fi
