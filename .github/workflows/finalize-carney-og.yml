name: Finalize Carney Kakao preview
on:
  push:
    branches: [feat/carney-kakao-og]
    paths:
      - 'tools/finalize_carney_og.py'
      - '.github/workflows/finalize-carney-og.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carney-kakao-og
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image tools and Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          python -m pip install --disable-pip-version-check pillow
      - name: Build final 1200x630 Carney share image
        run: python tools/finalize_carney_og.py
      - name: Clean temporary inspection files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/finalize_carney_og.py tools/list_page_images.py
          rm -f .github/workflows/finalize-carney-og.yml
          rm -f .github/workflows/list-page-images.yml
          rm -f .github/workflows/inspect-old-og.yml
          rm -f .github/workflows/inspect-old-og-ocr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Carney Kakao link preview"
          git push origin HEAD:feat/carney-kakao-og
