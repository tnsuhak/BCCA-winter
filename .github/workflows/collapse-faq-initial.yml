name: Collapse FAQ initial state

on:
  push:
    branches: [feat/carney-winter-schooling]
    paths:
      - 'tools/collapse_faq_initial.py'
      - '.github/workflows/collapse-faq-initial.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carney-winter-schooling
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Collapse FAQ by default
        run: python tools/collapse_faq_initial.py
      - name: Commit page and remove temporary updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/collapse_faq_initial.py .github/workflows/collapse-faq-initial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Keep FAQ collapsed on initial load"
          git push origin HEAD:feat/carney-winter-schooling
