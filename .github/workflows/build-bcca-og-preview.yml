name: Build BCCA OG preview thumbnail

on:
  push:
    branches:
      - feat/canada-kakao-info-room
    paths:
      - tools/build_bcca_og_preview.py
      - .github/workflows/build-bcca-og-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canada-kakao-info-room
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip pillow
      - name: Build OG image and metadata
        run: python tools/build_bcca_og_preview.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('og-bcca-2027.jpg')
          assert p.exists()
          assert Image.open(p).size == (1200, 630)
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'https://deploy-preview-3--bcca-winter.netlify.app/og-bcca-2027.jpg',
              '<meta property="og:image:type" content="image/jpeg">',
              '<meta property="og:image:width" content="1200">',
              '<meta property="og:image:height" content="630">',
          ]
          for item in required:
              assert item in s, item
          print('OG validation passed')
          PY
      - name: Commit generated image and metadata
        run: |
          if git diff --quiet; then
            echo "No OG changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html og-bcca-2027.jpg
          git commit -m "Add 1200x630 BCCA social sharing thumbnail"
          git push origin HEAD:feat/canada-kakao-info-room
