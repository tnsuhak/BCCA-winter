name: Inspect Carney page images
on:
  push:
    branches: [feat/carney-kakao-og]
    paths:
      - 'tools/list_page_images.py'
      - '.github/workflows/list-page-images.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carney-kakao-og
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/list_page_images.py
