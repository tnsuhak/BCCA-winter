name: Move BCCA notice after deadline strip
on:
  push:
    branches: [feat/canada-kakao-info-room]
    paths:
      - tools/move_notice_after_deadline.py
      - .github/workflows/move-notice-after-deadline.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canada-kakao-info-room
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/move_notice_after_deadline.py
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place BCCA closure notice after deadline strip"
          git push origin HEAD:feat/canada-kakao-info-room
