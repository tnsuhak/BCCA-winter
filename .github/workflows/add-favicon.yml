name: Add TNS favicon

on:
  push:
    branches: [feat/carney-kakao-og]
    paths:
      - 'tools/add_favicon.py'
      - '.github/workflows/add-favicon.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carney-kakao-og
          fetch-depth: 0
      - name: Add favicon links
        run: python tools/add_favicon.py
      - name: Commit and clean updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/add_favicon.py .github/workflows/add-favicon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire TNS favicon into Carney site"
          git push origin HEAD:feat/carney-kakao-og
