name: Remove duplicate BCCA bottom content
on:
  push:
    branches: [feat/canada-kakao-info-room]
    paths:
      - tools/remove_duplicate_bottom.py
      - .github/workflows/remove-duplicate-bottom.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canada-kakao-info-room
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/remove_duplicate_bottom.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '상담 시 학생의 학년, 현재 영어 수준, 부모님과 떨어져 지낸 경험 여부' not in s
          assert not ('<footer>' in s and '2027 BCCA 겨울 스쿨링 캠프 안내 페이지' in s)
          assert 'class="sticky-bar"' in s
          print('Validation passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove duplicate bottom contact content"
          git push origin HEAD:feat/canada-kakao-info-room
