name: Update BCCA Kakao link

on:
  push:
    branches:
      - fix/2027-bcca-schooling
    paths:
      - '.github/workflows/update-kakao-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2027-bcca-schooling
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Kakao consultation link
        run: python tools/update_kakao_link.py
      - name: Commit Kakao link update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Kakao consultation link [skip ci]"
          git push origin HEAD:fix/2027-bcca-schooling
