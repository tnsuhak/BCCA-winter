name: Reduce BCCA footer text
on:
  push:
    branches: [feat/canada-kakao-info-room]
    paths:
      - tools/reduce_footer_text.py
      - .github/workflows/reduce-footer-text.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canada-kakao-info-room
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/reduce_footer_text.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'font-size:11.5px;color:#c2d3e2' in s
          assert 'font-size:11.8px;color:#93a8bb' in s
          assert '.tags span{font-size:10.5px;padding:6px 11px;}' in s
          assert '.disclaimer{font-size:10.8px;line-height:1.65' in s
          print('Validation passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reduce BCCA footer secondary text sizes"
          git push origin HEAD:feat/canada-kakao-info-room
