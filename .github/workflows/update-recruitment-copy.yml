name: Update BCCA recruitment copy
on:
  push:
    branches: [feat/canada-kakao-info-room]
    paths:
      - tools/update_recruitment_copy.py
      - .github/workflows/update-recruitment-copy.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canada-kakao-info-room
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update recruitment copy
        run: python tools/update_recruitment_copy.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'BCCA 스쿨링 캠프 모집 마감' in s
          assert 'BCCA 스쿨링 캠프 모집이 마감되었습니다.(모집 시작 후 26일만에 마감) 추가 자리가 확보되면 이 페이지에서 다시 안내드립니다.' in s
          assert 'BCCA와 비슷한 비용·구성으로 학교 측 최종 협의 중이며, 마감이 빠르므로 확정 전 대기 예약을 추천 드립니다.' in s
          assert 'BCCA 스쿨링 캠프 14명 모집 마감' not in s
          print('Validation passed.')
          PY
          if git diff --quiet -- index.html; then
            echo "No site changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Revise BCCA recruitment closure copy"
          git push origin HEAD:feat/canada-kakao-info-room
