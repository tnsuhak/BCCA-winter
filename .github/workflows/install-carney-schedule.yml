name: Install uploaded Carney schedule image

on:
  push:
    branches: [feat/carney-winter-schooling]
    paths:
      - '.tmp-carney-schedule/**'
      - '.github/workflows/install-carney-schedule.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carney-winter-schooling
          fetch-depth: 0
      - name: Assemble and install schedule image
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-carney-schedule/part*.b64 | base64 -d > assets/carney-2027-schedule.webp
          test "$(stat -c%s assets/carney-2027-schedule.webp)" -eq 56408
          echo "0552b7c7b0244adb30acbc654a2af8ccbffac24838ce8726a1cefdbc401c65f5  assets/carney-2027-schedule.webp" | sha256sum -c -
          grep -q 'assets/carney-2027-schedule.svg' index.html
          sed -i 's#assets/carney-2027-schedule\.svg#assets/carney-2027-schedule.webp#g' index.html
          rm -f assets/carney-2027-schedule.svg
          rm -rf .tmp-carney-schedule
          rm -f .github/workflows/install-carney-schedule.yml
      - name: Commit final page asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use uploaded Carney schedule image"
          git push origin HEAD:feat/carney-winter-schooling
