name: Simplify BCCA recruitment notice
on:
  push:
    branches: [feat/canada-kakao-info-room]
    paths:
      - tools/simplify_recruitment_notice.py
      - .github/workflows/simplify-recruitment-notice.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canada-kakao-info-room
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Simplify notice
        run: python tools/simplify_recruitment_notice.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'BCCA 스쿨링 캠프 14명 모집 마감' in s
          assert '2026. 9. 8 업데이트' not in s
          assert '대체 프로그램 준비 중' in s
          assert 'Archbishop Carney Secondary School · 중1~고1' in s
          print('Validation passed.')
          PY
          if git diff --quiet -- index.html; then
            echo "No site changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify BCCA recruitment closure notice"
          git push origin HEAD:feat/canada-kakao-info-room
