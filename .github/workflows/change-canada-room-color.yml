name: Change Canada room card color

on:
  push:
    branches:
      - feat/canada-kakao-info-room
    paths:
      - tools/change_canada_room_color.py
      - .github/workflows/change-canada-room-color.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canada-kakao-info-room
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Change card color
        run: python tools/change_canada_room_color.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '.ch-canada-room{background:#C94A3F;color:#fff;}' in s
          print('Validation passed.')
          PY
          if git diff --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change Canada Kakao room card to maple red"
          git push origin HEAD:feat/canada-kakao-info-room
