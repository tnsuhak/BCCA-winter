<svg xmlns="http://www.w3.org/2000/svg" width="935" height="1171" viewBox="0 0 935 1171">
<foreignObject width="935" height="1171">
<div xmlns="http://www.w3.org/1999/xhtml" style="width:935px;height:1171px;background:#fff;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;color:#173f54;box-sizing:border-box;padding:12px 22px 18px;">
<style>
*{box-sizing:border-box}.school{font-size:21px;font-weight:800;text-decoration:underline;margin:0 0 34px}.title{font-size:34px;font-weight:900;margin:0 0 30px}.dow{display:grid;grid-template-columns:90px repeat(7,1fr);margin-left:0;border-bottom:2px solid #a9bec9}.dow span{font-size:16px;font-weight:900;text-align:center;padding:4px 0}.weeks{display:grid;gap:4px}.week{display:grid;grid-template-columns:90px repeat(7,1fr);min-height:180px;border-bottom:2px solid #c4d0d7;position:relative}.wlabel{display:flex;flex-direction:column;justify-content:center;font-weight:900;font-size:17px;line-height:1.4;padding-left:5px}.wlabel small{font-size:15px}.day{position:relative;border-left:5px solid #fff;padding:13px 7px 8px;font-size:11.5px;line-height:1.45;text-align:center;min-height:100%}.date{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);background:#f7941d;color:#fff;font-size:16px;font-weight:900;padding:0 7px;line-height:22px;z-index:3}.west{background:#123f55;color:#fff}.purple{background:#c3c9e8;color:#123f55}.sat{background:#5f70bf;color:#fff}.schooling{background:#f8c9b8;color:#123f55;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}.move{background:#faedbd;color:#183f52;font-size:12px;display:flex;align-items:center;justify-content:center}.esl{background:#dfebc8;color:#17485a;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center}.last{background:#5f70bf;color:#fff;font-size:12px}.span5{grid-column:3/8}.span4{grid-column:3/7}.rowstack{grid-column:3/8;display:grid;grid-template-rows:1.7fr .55fr 1fr;border-left:5px solid #fff;border-right:5px solid #fff}.rowstack4{grid-column:3/7;display:grid;grid-template-rows:1.7fr .55fr 1fr;border-left:5px solid #fff;border-right:5px solid #fff}.r{display:flex;align-items:center;justify-content:center;text-align:center;border-bottom:4px solid #fff}.r:last-child{border-bottom:0}.week2,.week3,.week4{min-height:180px}.week5{min-height:188px}.note{font-size:13px;color:#e33127;text-align:right;margin-top:4px}.tiny{font-size:10px}.strong{font-weight:900}
</style>
<div class="school">2027 Archbishop Carney Regional Secondary School</div>
<div class="title">에듀스마트 캠프일정</div>
<div class="dow"><span></span><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
<div class="weeks">
  <div class="week">
    <div class="wlabel">WEEK1<small>1/10 - 1/16</small></div>
    <div></div><div></div><div></div>
    <div class="day west"><span class="date">13</span>한국출발<br/>미국 LA입국<br/>UCLA대학 탐방<br/>저녁쌈 캠퍼스 투어<br/>할리우드 스타의 거리<br/>그리피스 &amp; 게티센터</div>
    <div class="day west"><span class="date">14</span>유니버설 스튜디오<br/>할리우드 종일 투어<br/>해리포터 월드<br/>트랜스포머 라이드</div>
    <div class="day west"><span class="date">15</span>디즈니랜드 종일<br/>슬리핑뷰티 캐슬<br/>스타워즈 갤럭시<br/>자유이용권 포함</div>
    <div class="day west"><span class="date">16</span>샌디에고<br/>씨월드 종일 투어<br/>돌핀래 어드벤처<br/>범고래 쇼</div>
  </div>
  <div class="week week2">
    <div class="wlabel">WEEK2<small>1/17 - 1/23</small></div>
    <div class="day purple"><span class="date">17</span>미국 LA 출발<br/>캐나다 밴쿠버 입국<br/>홈스테이 배정</div>
    <div class="rowstack"><div class="r schooling"><div><span class="date" style="left:10%;">18</span><span class="date" style="left:30%;">19</span><span class="date" style="left:50%;">20</span><span class="date" style="left:70%;">21</span><span class="date" style="left:90%;">22</span>8:30~3:00<br/>ACRSS 스쿨링</div></div><div class="r move">홈스테이로 이동</div><div class="r esl">4:00~5:00<br/>온라인 ESL / MATH</div></div>
    <div class="day sat"><span class="date">23</span>다운타운투어<br/>게스타운<br/>캐나다플레이스<br/>스탠리파크</div>
  </div>
  <div class="week week3">
    <div class="wlabel">WEEK3<small>1/24 - 1/30</small></div>
    <div class="day purple"><span class="date">24</span>Activity with<br/>Homestay</div>
    <div class="rowstack"><div class="r schooling"><div><span class="date" style="left:10%;">25</span><span class="date" style="left:30%;">26</span><span class="date" style="left:50%;">27</span><span class="date" style="left:70%;">28</span><span class="date" style="left:90%;">29</span>8:30~3:00<br/>ACRSS 스쿨링</div></div><div class="r move">홈스테이로 이동</div><div class="r esl">4:00~5:00<br/>온라인 ESL / MATH</div></div>
    <div class="day sat"><span class="date">30</span>메트로타운<br/>쇼핑센터</div>
  </div>
  <div class="week week4">
    <div class="wlabel">WEEK4<small>1/31 - 2/6</small></div>
    <div class="day purple"><span class="date">31</span>Activity with<br/>Homestay</div>
    <div class="rowstack"><div class="r schooling"><div><span class="date" style="left:10%;">2/1</span><span class="date" style="left:30%;">2/2</span><span class="date" style="left:50%;">2/3</span><span class="date" style="left:70%;">2/4</span><span class="date" style="left:90%;">2/5</span>8:30~3:00<br/>ACRSS 스쿨링</div></div><div class="r move">홈스테이로 이동</div><div class="r esl">4:00~5:00<br/>온라인 ESL / MATH</div></div>
    <div class="day sat"><span class="date">2/6</span>UBC 멘토링<br/>캠퍼스 투어</div>
  </div>
  <div class="week week5">
    <div class="wlabel">WEEK5<small>2/7 - 2/14</small></div>
    <div class="day purple"><span class="date">2/7</span>Activity with<br/>Homestay</div>
    <div class="rowstack4"><div class="r schooling"><div><span class="date" style="left:12.5%;">2/8</span><span class="date" style="left:37.5%;">2/9</span><span class="date" style="left:62.5%;">2/10</span><span class="date" style="left:87.5%;">2/11</span>8:30~3:00<br/>ACRSS 스쿨링</div></div><div class="r move">홈스테이로 이동</div><div class="r esl">4:00~5:00<br/>온라인 ESL / MATH</div></div>
    <div class="day last"><span class="date">2/12</span><span class="strong">8:30~12:00<br/>스쿨링 마지막<br/>수료식</span><br/>12:00 이후<br/>홈스테이 정리</div>
    <div class="day sat"><span class="date">2/13-14</span>2/13 SAT<br/>밴쿠버 출발<br/>YVR → ICN<br/>2/14 SUN<br/>한국 도착<br/>인천공항 해산</div>
  </div>
</div>
<div class="note">*상기 스케줄은 현지 사정으로 변동이 있을 수 있습니다</div>
</div>
</foreignObject>
</svg>